name: Feature request
description: Suggest a new feature, customization, or improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Larger ideas should usually start as a [Discussion](https://github.com/Iajensen222222/AuraShell/discussions) so the design can be hashed out before someone commits to building it.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user-facing pain point. Avoid jumping straight to a proposed solution.
      placeholder: |
        I want to customize the taskbar opacity per-workspace, but right now opacity is a single global setting.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine this working. Mockups or screenshots welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about and why this one is preferred.

  - type: dropdown
    id: scope
    attributes:
      label: Approximate scope
      description: Rough sense of how big this is. Helps with triage.
      options:
        - Small — UI tweak or single setting
        - Medium — new page, new customization category
        - Large — new subsystem (rendering, IPC, theming engine, etc.)
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Pre-submission checklist
      options:
        - label: I've searched existing issues and Discussions for this idea.
          required: true
        - label: For larger features, I've considered opening a Discussion first.
          required: false
