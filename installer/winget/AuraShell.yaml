ShortDescription: Audio-reactive glow overlays and per-desktop themes for Windows 11
Description: |-
  AuraShell transforms your Windows 11 desktop into a living visual experience.
  Hover over any taskbar icon and watch a real-time audio-reactive glow bloom around it,
  driven by your system's live 128-band FFT audio spectrum. Assign a unique color theme
  to each virtual desktop. DWM acrylic backdrop, 60 fps DirectX overlay, under 1% idle CPU.
  Six-page WinUI 3 configuration app. Open-source, no telemetry, no subscription.
Moniker: aurashell
